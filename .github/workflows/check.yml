name: check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check bot, channel and sources
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: python repost.py --check

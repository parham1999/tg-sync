name: repost

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: repost
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Queue the next run right now (it starts the moment this one ends, even if this one crashes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date +%s > /tmp/started
          gh workflow run repost.yml --repo "${{ github.repository }}" || true
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Run the bot (stays alive about 5.5 hours, answers buttons every 20 seconds)
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          SETTINGS_JSON: ${{ secrets.SETTINGS_JSON }}
        run: python repost.py --serve 330
      - name: Save progress
        if: always()
        run: |
          git config user.name "repost-bot"
          git config user.email "repost-bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "update state"
            git push || (git pull --rebase --autostash && git push)
          fi
      - name: If this run died quickly, wait a little so a broken run cannot loop too fast
        if: always()
        run: |
          s=$(cat /tmp/started 2>/dev/null || date +%s)
          if [ $(( $(date +%s) - s )) -lt 300 ]; then sleep 300; fi

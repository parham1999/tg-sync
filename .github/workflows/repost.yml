name: repost

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: repost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repost new posts
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: python repost.py --once
      - name: Save progress
        run: |
          git config user.name "repost-bot"
          git config user.email "repost-bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "update state"
            git push || (git pull --rebase && git push)
          fi
